      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

24\u0438\u043a\u0441\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u044b\u0439 seed = 42 \u0434\u0435\u043b\u0430\u0435\u0442 \u0440\u0430\u0441\u0447\u0451\u0442 \u0432\u043e\u0441\u043f\u0440\u043e\u0438\u0437\u0432\u043e\u0434\u0438\u043c\u044b\u043c.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003E\u0420\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442 \u0434\u043b\u044f \u0442\u0435\u043a\u0443\u0449\u0435\u0433\u043e \u0432\u044b\u0431\u043e\u0440\u0430.\u003C/strong\u003E \u03c7\u00b2 = \u003Cstrong\u003E2748.6\u003C/strong\u003E, p = \u003Cstrong\u003E0.0005\u003C/strong\u003E, \u043a\u043e\u044d\u0444\u0444\u0438\u0446\u0438\u0435\u043d\u0442 \u0421\u043f\u0438\u0440\u043c\u0435\u043d\u0430 = \u003Cstrong\u003E0.38\u003C/strong\u003E. \u041f\u0440\u0438 \u0443\u0440\u043e\u0432\u043d\u0435 0,05 \u043e\u0442\u0432\u0435\u0440\u0433\u0430\u0435\u043c \u0433\u0438\u043f\u043e\u0442\u0435\u0437\u0443 \u043d\u0435\u0437\u0430\u0432\u0438\u0441\u0438\u043c\u043e\u0441\u0442\u0438.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003E\u041a\u0430\u043a \u043f\u043e\u043d\u0438\u043c\u0430\u0442\u044c \u0447\u0438\u0441\u043b\u0430.\u003C/strong\u003E \u041c\u0430\u043b\u043e\u0435 p \u043e\u0437\u043d\u0430\u0447\u0430\u0435\u0442, \u0447\u0442\u043e \u0442\u0430\u043a\u043e\u0435 \u0438\u043b\u0438 \u0431\u043e\u043b\u044c\u0448\u0435\u0435 \u0440\u0430\u0441\u0445\u043e\u0436\u0434\u0435\u043d\u0438\u0435 \u0440\u0435\u0434\u043a\u043e\n\u0432\u043e\u0437\u043d\u0438\u043a\u0430\u0435\u0442 \u043f\u0440\u0438 \u043f\u0435\u0440\u0435\u0441\u0442\u0430\u043d\u043e\u0432\u043a\u0430\u0445. \u042d\u0442\u043e \u043d\u0435 \u0432\u0435\u0440\u043e\u044f\u0442\u043d\u043e\u0441\u0442\u044c \u0438\u0441\u0442\u0438\u043d\u043d\u043e\u0441\u0442\u0438 \u0433\u0438\u043f\u043e\u0442\u0435\u0437\u044b.\n\u041a\u043e\u044d\u0444\u0444\u0438\u0446\u0438\u0435\u043d\u0442 \u0421\u043f\u0438\u0440\u043c\u0435\u043d\u0430 \u043b\u0435\u0436\u0438\u0442 \u043e\u0442 \u22121 \u0434\u043e 1: \u0437\u043d\u0430\u043a \u043f\u043e\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u0442 \u043d\u0430\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u0435 \u043c\u043e\u043d\u043e\u0442\u043e\u043d\u043d\u043e\u0439 \u0441\u0432\u044f\u0437\u0438,\n\u0430 \u043c\u043e\u0434\u0443\u043b\u044c \u2014 \u0435\u0451 \u0432\u044b\u0440\u0430\u0436\u0435\u043d\u043d\u043e\u0441\u0442\u044c. \u0417\u043d\u0430\u0447\u0435\u043d\u0438\u0435 \u043e\u043a\u043e\u043b\u043e \u043d\u0443\u043b\u044f \u0441\u0430\u043c\u043e \u043f\u043e \u0441\u0435\u0431\u0435 \u043d\u0435 \u0434\u043e\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u0442 \u043d\u0435\u0437\u0430\u0432\u0438\u0441\u0438\u043c\u043e\u0441\u0442\u044c.\n\u0415\u0441\u043b\u0438 p \u2265 0,05, \u044d\u0442\u043e \u0442\u043e\u0436\u0435 \u043d\u0435 \u0434\u043e\u043a\u0430\u0437\u0430\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u043e \u043d\u0435\u0437\u0430\u0432\u0438\u0441\u0438\u043c\u043e\u0441\u0442\u0438: \u043e\u0441\u043d\u043e\u0432\u0430\u043d\u0438\u0439 \u043e\u0442\u0432\u0435\u0440\u0433\u043d\u0443\u0442\u044c \u0435\u0451 \u043d\u0435\u0434\u043e\u0441\u0442\u0430\u0442\u043e\u0447\u043d\u043e.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003E\u041f\u0440\u043e\u043c\u0435\u0436\u0443\u0442\u043e\u0447\u043d\u044b\u0439 \u0432\u044b\u0432\u043e\u0434.\u003C/strong\u003E \u0420\u0435\u0448\u0435\u043d\u0438\u0435 \u0442\u0435\u0441\u0442\u0430 \u043e\u0442\u0432\u0435\u0447\u0430\u0435\u0442 \u043d\u0430 \u0432\u043e\u043f\u0440\u043e\u0441 \u043e \u0437\u0430\u0432\u0438\u0441\u0438\u043c\u043e\u0441\u0442\u0438,\n\u0430 \u0421\u043f\u0438\u0440\u043c\u0435\u043d \u043f\u043e\u043c\u043e\u0433\u0430\u0435\u0442 \u043f\u043e\u043d\u044f\u0442\u044c \u0435\u0451 \u043d\u0430\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u0435. \u042d\u0442\u0438 \u0447\u0438\u0441\u043b\u0430 \u043d\u0443\u0436\u043d\u043e \u0447\u0438\u0442\u0430\u0442\u044c \u0432\u043c\u0435\u0441\u0442\u0435.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u0427\u0438\u0441\u043b\u043e \u0430\u043a\u0442\u0438\u0432\u043d\u044b\u0445 \u044f\u0447\u0435\u0435\u043a \u043e\u0433\u0440\u0430\u043d\u0438\u0447\u0435\u043d\u043e \u043f\u043b\u043e\u0449\u0430\u0434\u044c\u044e \u0440\u0430\u043c\u043a\u0438: \u043f\u0440\u0438 \u0432\u044b\u0441\u043e\u0442\u0435 \u0438\u0437\u043e\u0431\u0440\u0430\u0436\u0435\u043d\u0438\u044f 8 \u043e\u043d\u043e \u043d\u0435 \u043f\u0440\u0435\u0432\u044b\u0448\u0430\u0435\u0442\n\u0432\u043e\u0441\u044c\u043c\u0438 \u0448\u0438\u0440\u0438\u043d (A \u2264 8W). \u042d\u0442\u043e \u0433\u0435\u043e\u043c\u0435\u0442\u0440\u0438\u0447\u0435\u0441\u043a\u043e\u0435 \u043e\u0433\u0440\u0430\u043d\u0438\u0447\u0435\u043d\u0438\u0435, \u043d\u043e \u0441\u0430\u043c\u043e \u043f\u043e \u0441\u0435\u0431\u0435 \u043e\u043d\u043e \u043d\u0435 \u0437\u0430\u043c\u0435\u043d\u044f\u0435\u0442 \u0442\u0435\u0441\u0442.\n\u0414\u0430\u0436\u0435 \u0435\u0441\u043b\u0438 \u0441\u0432\u044f\u0437\u044c\n\u0432\u0438\u0434\u043d\u0430, \u0438\u0437 \u043d\u0435\u0451 \u043d\u0435\u043b\u044c\u0437\u044f \u0441\u0434\u0435\u043b\u0430\u0442\u044c \u0432\u044b\u0432\u043e\u0434 \u043e \u0442\u043e\u043c, \u043a\u0430\u043a \u0447\u0435\u043b\u043e\u0432\u0435\u043a \u043f\u0438\u0441\u0430\u043b \u0446\u0438\u0444\u0440\u0443.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "dd2c30c5eff38a8189e416903304196c", "console": [], "id": "Hstk", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cspan id=\"groups\"\u003E\u003C/span\u003E\u003C/span\u003E\n\u003Ch2 id=\"4\"\u003E4. \u0427\u0442\u043e \u043c\u0435\u043d\u044f\u0435\u0442\u0441\u044f \u
